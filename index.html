<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIP-C01 — Trắc nghiệm AWS Certified Generative AI Developer</title>
<link rel="icon" type="image/png" href="v-icon.png">
<meta name="description" content="Luyện thi trắc nghiệm AWS Certified Generative AI Developer – Professional (AIP-C01).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0B0D13;
    --bg-2:      #0F1117;
    --surface:   #161925;
    --surface-2: #1C2030;
    --surface-3: #232838;
    --border:    #272C3E;
    --border-2:  #333A52;
    --text:      #F2F4FA;
    --muted:     #9AA3B7;
    --muted-2:   #6B7488;

    --accent:    #6366F1;
    --accent-2:  #818CF8;
    --accent-dim: rgba(99, 102, 241, 0.14);
    --good:      #34D399;
    --good-dim:  rgba(52, 211, 153, 0.14);
    --bad:       #F87171;
    --bad-dim:   rgba(248, 113, 113, 0.14);
    --warn:      #FBBF24;

    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --font-body: 'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;

    --space-xs: 0.375rem;
    --space-s:  0.75rem;
    --space-m:  1.25rem;
    --space-l:  2rem;
    --space-xl: 3rem;

    --radius:    10px;
    --radius-lg: 16px;
    --radius-xl: 22px;

    --shadow:    0 8px 24px rgba(0,0,0,0.35);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.5);

    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(52,211,153,0.06), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    min-height: 100vh;
  }

  ::selection { background: var(--accent-dim); color: var(--text); }

  *:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .icon { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  .nav-right { display: flex; align-items: center; gap: var(--space-m); }
  .nav-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .nav-meta b { color: var(--text); }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-xs);
    padding: 0.5rem var(--space-m);
    border-radius: var(--radius);
    font-size: 0.875rem;
    font-family: var(--font-body);
    font-weight: 500;
    cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), transform .1s var(--ease), box-shadow .2s var(--ease);
    text-decoration: none;
    border: 1px solid transparent;
    line-height: 1.4;
    white-space: nowrap;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn .icon { width: 16px; height: 16px; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 4px 16px rgba(99,102,241,0.35);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(99,102,241,0.5); }

  .btn-ghost { background: var(--surface-2); color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--border-2); background: var(--surface-3); }

  /* ── TOGGLE ── */
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
  .toggle-track {
    width: 36px; height: 20px; border-radius: 999px; flex: 0 0 auto;
    background: var(--surface-2); border: 1px solid var(--border);
    position: relative; transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  .toggle-thumb {
    position: absolute; top: 1px; left: 1px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted); transition: transform .2s var(--ease), background .2s var(--ease);
  }
  .toggle input:checked + .toggle-track { background: var(--accent-dim); border-color: var(--accent); }
  .toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(16px); background: var(--accent); }
  .toggle-label { font-size: 0.78rem; color: var(--muted); font-family: var(--font-mono); white-space: nowrap; }
  .toggle input:checked ~ .toggle-label { color: var(--text); }

  .btn-good {
    background: linear-gradient(135deg, var(--good), #2dd4bf);
    color: #05281d;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(52,211,153,0.3);
  }
  .btn-good:hover:not(:disabled) { box-shadow: 0 6px 22px rgba(52,211,153,0.45); }

  /* ── LAYOUT ── */
  main { max-width: 860px; margin: 0 auto; padding: var(--space-l) var(--space-l) var(--space-xl); }

  /* ── SEARCH ── */
  .search-wrap { position: relative; padding-top: var(--space-m); }
  .search-box {
    display: flex; align-items: center; gap: var(--space-s);
    padding: 0.65rem var(--space-m);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    transition: border-color .2s var(--ease);
  }
  .search-box:focus-within { border-color: var(--accent); }
  .search-box .icon { width: 17px; height: 17px; color: var(--muted); flex: 0 0 auto; }
  .search-box input {
    flex: 1; border: none; outline: none; background: none;
    color: var(--text); font-family: var(--font-body); font-size: 0.9rem;
  }
  .search-box input::placeholder { color: var(--muted-2); }
  .search-clear {
    display: grid; place-items: center; width: 24px; height: 24px;
    border-radius: 999px; border: none; background: var(--surface-2);
    color: var(--muted); cursor: pointer; flex: 0 0 auto;
  }
  .search-clear .icon { width: 13px; height: 13px; }
  .search-clear:hover { color: var(--text); background: var(--surface-3); }
  .search-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    max-height: 420px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border-2);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    animation: cardIn .2s var(--ease);
  }
  .search-count {
    padding: var(--space-s) var(--space-m) 4px;
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted-2);
  }
  .search-result {
    display: flex; flex-direction: column; gap: 4px; width: 100%;
    text-align: left; padding: var(--space-s) var(--space-m);
    background: none; border: none; border-top: 1px solid var(--border);
    color: var(--text); cursor: pointer; font-family: var(--font-body);
  }
  .search-count + .search-result { border-top: none; }
  .search-result:hover, .search-result:focus-visible { background: var(--surface-2); }
  .sr-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-s); }
  .sr-meta {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted);
    letter-spacing: 0.02em;
  }
  .sr-status {
    display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto;
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted-2); background: var(--surface-2);
  }
  .sr-status .icon { width: 11px; height: 11px; }
  .sr-status.ok { color: var(--good); background: var(--good-dim); border-color: rgba(52,211,153,0.3); }
  .sr-status.err { color: var(--bad); background: var(--bad-dim); border-color: rgba(248,113,113,0.3); }
  .sr-snippet { font-size: 0.84rem; color: var(--muted); line-height: 1.5; }
  .sr-snippet mark { background: var(--accent-dim); color: var(--accent-2); border-radius: 3px; padding: 0 2px; }
  .search-empty {
    padding: var(--space-l) var(--space-m); text-align: center;
    color: var(--muted); font-size: 0.85rem;
  }

  .search-filters { display: flex; gap: var(--space-s); margin-top: var(--space-s); }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 0.76rem;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .filter-chip .icon { width: 13px; height: 13px; }
  .filter-chip:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-2); }
  .filter-chip.active { color: var(--good); border-color: rgba(52,211,153,0.4); background: var(--good-dim); }
  .filter-chip .count { color: var(--muted-2); }
  .filter-chip.active .count { color: var(--good); }

  .search-scope-filters { display: flex; gap: var(--space-s); margin-top: var(--space-s); flex-wrap: wrap; }
  .scope-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 0.76rem;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 12px; cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .scope-chip input { accent-color: var(--good); cursor: pointer; }
  .scope-chip:hover { color: var(--text); border-color: var(--border-2); }
  .scope-chip.active { color: var(--good); border-color: rgba(52,211,153,0.4); background: var(--good-dim); }

  .search-history-item { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--border); }
  .search-count + .search-history-item { border-top: none; }
  .sh-term {
    flex: 1; display: flex; align-items: center; gap: 8px;
    text-align: left; padding: var(--space-s) var(--space-m);
    background: none; border: none; color: var(--text); cursor: pointer;
    font-family: var(--font-body); font-size: 0.85rem;
  }
  .sh-term .icon { width: 14px; height: 14px; color: var(--muted); flex: 0 0 auto; }
  .sh-term:hover, .sh-term:focus-visible { background: var(--surface-2); }
  .sh-remove {
    display: grid; place-items: center; width: 26px; height: 26px; margin-right: var(--space-s);
    border-radius: 999px; border: none; background: none; color: var(--muted); cursor: pointer; flex: 0 0 auto;
  }
  .sh-remove .icon { width: 12px; height: 12px; }
  .sh-remove:hover { color: var(--bad); background: var(--bad-dim); }

  /* ── PROGRESS ── */
  .progress-wrap {
    padding: var(--space-m) 0;
    background: linear-gradient(var(--bg) 70%, transparent);
  }

  /* ── SCROLL TO TOP ── */
  .scroll-top-btn {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 90;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid var(--border-2);
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: 0 6px 20px rgba(99,102,241,0.4);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transform: translateY(8px);
    transition: opacity .2s var(--ease), transform .2s var(--ease), box-shadow .2s var(--ease);
  }
  .scroll-top-btn.visible { opacity: 1; pointer-events: auto; transform: none; }
  .scroll-top-btn:hover { box-shadow: 0 8px 26px rgba(99,102,241,0.55); }
  .scroll-top-btn .icon { width: 20px; height: 20px; stroke-width: 2.5; }
  .progress-track {
    height: 8px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--good));
    background-size: 200% 100%;
    transition: width .45s var(--ease);
  }
  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: var(--space-s);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .chip .icon { width: 13px; height: 13px; }
  .chip.ok { color: var(--good); border-color: rgba(52,211,153,0.3); background: var(--good-dim); }
  .chip.err { color: var(--bad); border-color: rgba(248,113,113,0.3); background: var(--bad-dim); }

  /* ── QUESTION CARD ── */
  .qcard {
    position: relative;
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: var(--space-l);
    box-shadow: var(--shadow);
    animation: cardIn .35s var(--ease);
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .qmeta {
    display: flex;
    align-items: center;
    gap: var(--space-s);
    flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: var(--space-m);
  }
  .topic { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  .topic .icon { width: 14px; height: 14px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 11px;
    border-radius: 999px;
    background: var(--accent-dim);
    color: var(--accent-2);
    border: 1px solid rgba(99,102,241,0.3);
    font-weight: 600;
  }
  .badge .icon { width: 13px; height: 13px; }
  .badge.multi { background: var(--good-dim); color: var(--good); border-color: rgba(52,211,153,0.3); }

  .reflink {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.74rem; color: var(--muted-2); text-decoration: none;
    transition: color .2s var(--ease);
  }
  .reflink .icon { width: 13px; height: 13px; }
  .reflink:hover { color: var(--accent-2); }

  .copybtn {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--font-mono); font-size: 0.72rem;
    color: var(--muted); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 11px; cursor: pointer;
    transition: color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
  }
  .copybtn .icon { width: 13px; height: 13px; }
  .copybtn:hover { color: var(--text); border-color: var(--border-2); background: var(--surface-3); }
  .copybtn.done { color: var(--good); border-color: rgba(52,211,153,0.4); background: var(--good-dim); }
  /* copy button sits before the ref link, which then no longer auto-pushes */
  .qmeta .reflink { margin-left: 0; }

  mark.hl {
    background: linear-gradient(135deg, rgba(251,191,36,0.4), rgba(251,191,36,0.26));
    color: inherit;
    border-radius: 3px;
    padding: 0 2px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .qtext {
    font-size: 1.06rem;
    line-height: 1.72;
    margin-bottom: var(--space-l);
    color: #E7EAF3;
  }
  .qtext br { content: ""; display: block; margin-top: var(--space-s); }

  /* ── ANSWERS ── */
  .answers { display: flex; flex-direction: column; gap: 0.625rem; }

  .answer {
    display: flex;
    align-items: flex-start;
    gap: var(--space-m);
    padding: var(--space-m);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
    text-align: left;
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.94rem;
    color: var(--text);
    line-height: 1.6;
  }
  .answer:hover:not(.locked) { border-color: var(--border-2); background: var(--surface-3); }
  .answer.selected:not(.locked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .answer.locked { cursor: default; }

  .answer .key {
    flex: 0 0 auto;
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border-radius: 9px;
    border: 1.5px solid var(--border-2);
    font-family: var(--font-mono);
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--muted);
    transition: all .2s var(--ease);
  }
  .answer.single .key { border-radius: 50%; }
  .answer.selected .key { background: var(--accent); border-color: var(--accent); color: #fff; }

  .answer.correct { background: var(--good-dim); border-color: var(--good); }
  .answer.correct .key { background: var(--good); border-color: var(--good); color: #05281d; }
  .answer.wrong { background: var(--bad-dim); border-color: var(--bad); }
  .answer.wrong .key { background: var(--bad); border-color: var(--bad); color: #2c0b0b; }

  .answer .atext { flex: 1; user-select: text; -webkit-user-select: text; cursor: text; }
  .answer .mark {
    flex: 0 0 auto; margin-left: var(--space-s);
    display: grid; place-items: center;
    width: 22px; height: 22px; border-radius: 50%;
    animation: pop .3s var(--ease);
  }
  @keyframes pop { from { transform: scale(0); } 60% { transform: scale(1.2); } to { transform: scale(1); } }
  .answer .mark .icon { width: 16px; height: 16px; stroke-width: 2.75; }
  .answer.correct .mark { color: var(--good); }
  .answer.wrong .mark { color: var(--bad); }

  /* ── ACTIONS ── */
  .qactions {
    display: flex; align-items: center; gap: var(--space-m);
    margin-top: var(--space-l); flex-wrap: wrap;
  }
  .verdict {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 0.86rem; font-weight: 700;
    padding: 6px 13px; border-radius: 999px;
  }
  .verdict .icon { width: 16px; height: 16px; }
  .verdict.ok { color: var(--good); background: var(--good-dim); }
  .verdict.err { color: var(--bad); background: var(--bad-dim); }
  .hint { font-size: 0.82rem; color: var(--muted); }
  .hint b { color: var(--text); font-family: var(--font-mono); }

  /* ── QNAV ── */
  .qnav {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-m); margin-top: var(--space-l); flex-wrap: wrap;
  }
  .qjump {
    display: flex; align-items: center; gap: var(--space-s);
    font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted);
  }
  .qjump input {
    width: 60px; padding: 6px 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-family: var(--font-mono); font-size: 0.82rem; text-align: center;
  }
  .qjump input:focus { border-color: var(--accent); outline: none; }

  .kbd-hint {
    text-align: center; margin-top: var(--space-m);
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted-2);
  }
  kbd {
    font-family: var(--font-mono); font-size: 0.7rem;
    background: var(--surface-2); border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--muted);
  }

  /* ── LOADING / ERROR ── */
  .state { text-align: center; padding: var(--space-xl) var(--space-l); color: var(--muted); font-family: var(--font-mono); }
  .state.err { color: var(--bad); }
  .state .icon { width: 36px; height: 36px; margin-bottom: var(--space-m); }

  .skeleton { animation: cardIn .3s var(--ease); }
  .sk {
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
    border-radius: 8px;
  }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

  /* ── SUMMARY ── */
  .summary {
    background: linear-gradient(180deg, var(--surface), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: var(--radius-xl);
    padding: var(--space-xl) var(--space-l);
    text-align: center;
    box-shadow: var(--shadow);
    animation: cardIn .4s var(--ease);
  }
  .summary h2 { font-family: var(--font-mono); font-size: 1.4rem; font-weight: 800; margin-bottom: var(--space-l); }
  .donut { position: relative; width: 168px; height: 168px; margin: 0 auto var(--space-l); }
  .donut svg { transform: rotate(-90deg); }
  .donut-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .donut-center b { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 800; line-height: 1; }
  .donut-center span { font-size: 0.74rem; color: var(--muted); letter-spacing: 0.05em; margin-top: 4px; }
  .summary-stats {

  .summary-actions { display: flex; gap: var(--space-s); justify-content: center; flex-wrap: wrap; }

  footer { border-top: 1px solid var(--border); padding: var(--space-l); text-align: center; }
  footer p { font-size: 0.76rem; color: var(--muted-2); font-family: var(--font-mono); }

  @media (max-width: 640px) {

    main { padding: var(--space-m); }

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
const DATA_URL = 'aws_aip_c01.json';
const STORAGE_KEY = 'aip-c01-progress';
const SHUFFLE_KEY = 'aip-c01-shuffle';
const SEARCH_HISTORY_KEY = 'aip-c01-search-history';
const SEARCH_SCOPE_KEY = 'aip-c01-search-scope';
const MAX_SEARCH_HISTORY = 12;

let questions = [];
let idx = 0;
let answered = {};
let shuffleAnswers = false;
let shuffleOrder = {}; // idx -> shuffled key order, cached so it stays stable while answering
let searchIndex = []; // qi -> { qText, answerEntries, lower } built once questions load
let listMode = null; // null | 'multi' — which non-search listing is currently shown in #searchResults
let searchHistory = []; // most-recent-first list of past search terms
let searchScope = { question: true, correct: true, wrong: true }; // where a match may occur to count as a result

const $ = id => document.getElementById(id);
const app = $('app');
const ico = name => `<svg class="icon"><use href="#${name}"/></svg>`;

/* Source strings contain literal <br/> and HTML entities like &#39;.
   Escape everything (XSS-safe), then restore <br> and decode entities. */
function renderHTML(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/&lt;br\s*\/?&gt;/gi, '<br>')
    .replace(/&amp;#(\d+);/g, (_, n) => '&#' + n + ';')
    .replace(/&amp;([a-z]+);/gi, '&$1;');
}

/* Plain-text version of source strings: decode entities, turn <br/> into newlines. */
function toPlainText(str) {
  if (!str) return '';
  const html = renderHTML(str).replace(/<br\s*\/?>/gi, '\n');
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return (tmp.textContent || '').trim();
}

/* Build a clean prompt with question + options for pasting into an AI. */
function questionToText(q, qi) {
  const multi = isMulti(q);
  const cset = correctSet(q);
  const lines = [];
  lines.push(toPlainText(q.question_text));
  lines.push('');
  getDisplayKeys(qi, q).forEach(k => {
    lines.push(`${k}. ${toPlainText(q.answers[k])}`);
  });
  lines.push('');
  lines.push(multi ? `(Chọn ${cset.size} đáp án)` : '(Chọn một đáp án)');
  lines.push('Hãy chọn đáp án đúng và giải thích ngắn gọn lý do.');
  return lines.join('\n');
}

/* ── SEARCH ── */
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function buildSearchIndex() {
  searchIndex = questions.map(q => {
    const qText = toPlainText(q.question_text);
    const cset = correctSet(q);
    const answerEntries = Object.keys(q.answers).sort().map(k => ({ key: k, text: toPlainText(q.answers[k]), isCorrect: cset.has(k) }));
    return { qText, answerEntries };
  });
}

function buildSnippet(text, term) {
  const lower = text.toLowerCase();
  const i = lower.indexOf(term);
  if (i === -1) return escapeHtml(text.slice(0, 140)) + (text.length > 140 ? '…' : '');
  const start = Math.max(0, i - 50);
  const end = Math.min(text.length, i + term.length + 70);
  let out = escapeHtml(text.slice(start, i)) +
    '<mark>' + escapeHtml(text.slice(i, i + term.length)) + '</mark>' +
    escapeHtml(text.slice(i + term.length, end));
  if (start > 0) out = '…' + out;
  if (end < text.length) out += '…';
  return out;
}

function performSearch(rawQuery) {
  const term = rawQuery.trim().toLowerCase();
  const resultsEl = $('searchResults');
  $('searchClearBtn').hidden = !rawQuery;
  if (listMode) { listMode = null; $('multiListBtn').classList.remove('active'); }

  if (!term) { renderSearchHistory(); return; }
  if (!questions.length) return;

  if (!searchScope.question && !searchScope.correct && !searchScope.wrong) {
    resultsEl.hidden = false;
    resultsEl.innerHTML = `<div class="search-empty">Vui lòng chọn ít nhất một loại kết quả</div>`;
    return;
  }

  const matches = [];
  questions.forEach((q, qi) => {
    const entry = searchIndex[qi];
    if (!entry) return;
    let snippetSource = null, noteType = null, noteKey = null;

    if (searchScope.question && entry.qText.toLowerCase().includes(term)) {
      snippetSource = entry.qText; noteType = 'question';
    }
    if (!snippetSource && searchScope.correct) {
      const found = entry.answerEntries.find(a => a.isCorrect && a.text.toLowerCase().includes(term));
      if (found) { snippetSource = found.text; noteType = 'correct'; noteKey = found.key; }
    }
    if (!snippetSource && searchScope.wrong) {
      const found = entry.answerEntries.find(a => !a.isCorrect && a.text.toLowerCase().includes(term));
      if (found) { snippetSource = found.text; noteType = 'wrong'; noteKey = found.key; }
    }
    if (snippetSource) matches.push({ qi, snippetSource, noteType, noteKey });
  });

  resultsEl.hidden = false;
  if (!matches.length) {
    resultsEl.innerHTML = `<div class="search-empty">Không tìm thấy câu hỏi nào chứa "${escapeHtml(rawQuery.trim())}"</div>`;
    return;
  }

  resultsEl.innerHTML = `<div class="search-count">${matches.length} câu hỏi khớp</div>` + matches.map(m => {
    const q = questions[m.qi];
    const snippet = buildSnippet(m.snippetSource, term);
    let matchNote = '';
    if (m.noteType === 'correct') matchNote = ` · khớp ở đáp án đúng ${m.noteKey}`;
    else if (m.noteType === 'wrong') matchNote = ` · khớp ở đáp án sai ${m.noteKey}`;
    return `<button type="button" class="search-result" data-qi="${m.qi}">
      <span class="sr-top">
        <span class="sr-meta">${ico('i-layers')}Topic ${q.topic_number} · Câu ${q.question_number}${matchNote}</span>
        ${answerStatusBadge(m.qi)}
      </span>
      <span class="sr-snippet">${snippet}</span>
    </button>`;
  }).join('');

  resultsEl.querySelectorAll('.search-result').forEach(btn => {
    btn.addEventListener('click', () => {
      addToSearchHistory(rawQuery.trim());
      idx = parseInt(btn.dataset.qi, 10);
      saveProgress();
      render();
      updateProgress();
      closeSearch();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function closeSearch() {
  $('searchResults').hidden = true;
  $('searchResults').innerHTML = '';
  $('searchInput').value = '';
  $('searchClearBtn').hidden = true;
}

/* ── SEARCH HISTORY ── */
function loadSearchHistory() {
  try { searchHistory = JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]'); } catch (e) { searchHistory = []; }
  if (!Array.isArray(searchHistory)) searchHistory = [];
}
function saveSearchHistory() {
  try { localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(searchHistory)); } catch (e) {}
}
function addToSearchHistory(term) {
  if (!term) return;
  searchHistory = searchHistory.filter(t => t.toLowerCase() !== term.toLowerCase());
  searchHistory.unshift(term);
  if (searchHistory.length > MAX_SEARCH_HISTORY) searchHistory.length = MAX_SEARCH_HISTORY;
  saveSearchHistory();
}
function removeFromSearchHistory(term) {
  searchHistory = searchHistory.filter(t => t !== term);
  saveSearchHistory();
  renderSearchHistory();
}

function renderSearchHistory() {
  const resultsEl = $('searchResults');
  if (listMode) { listMode = null; $('multiListBtn').classList.remove('active'); }
  if (!searchHistory.length) { resultsEl.hidden = true; resultsEl.innerHTML = ''; return; }

  resultsEl.hidden = false;
  resultsEl.innerHTML = `<div class="search-count">Tìm kiếm gần đây</div>` + searchHistory.map(term => `
    <div class="search-history-item">
      <button type="button" class="sh-term" data-term="${escapeHtml(term)}">${ico('i-clock')}${escapeHtml(term)}</button>
      <button type="button" class="sh-remove" data-term="${escapeHtml(term)}" aria-label="Xóa lịch sử tìm kiếm">${ico('i-x')}</button>
    </div>
  `).join('');

  resultsEl.querySelectorAll('.sh-term').forEach(btn => {
    btn.addEventListener('click', () => {
      $('searchInput').value = btn.dataset.term;
      performSearch(btn.dataset.term);
    });
  });
  resultsEl.querySelectorAll('.sh-remove').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      removeFromSearchHistory(btn.dataset.term);
    });
  });
}

/* ── SEARCH SCOPE FILTERS ── */
function loadSearchScope() {
  try {
    const s = JSON.parse(localStorage.getItem(SEARCH_SCOPE_KEY) || 'null');
    if (s && typeof s === 'object') {
      searchScope = { question: !!s.question, correct: !!s.correct, wrong: !!s.wrong };
    }
  } catch (e) {}
}
function saveSearchScope() {
  try { localStorage.setItem(SEARCH_SCOPE_KEY, JSON.stringify(searchScope)); } catch (e) {}
}
function initSearchScopeFilters() {
  document.querySelectorAll('.scope-chip').forEach(label => {
    const scope = label.dataset.scope;
    const checkbox = label.querySelector('input[type=checkbox]');
    checkbox.checked = searchScope[scope];
    label.classList.toggle('active', searchScope[scope]);
    checkbox.addEventListener('change', () => {
      searchScope[scope] = checkbox.checked;
      label.classList.toggle('active', checkbox.checked);
      saveSearchScope();
      if ($('searchInput').value.trim()) performSearch($('searchInput').value);
    });
  });
}

/* ── LIST ALL MULTI-CHOICE QUESTIONS ──
   Reuses the search-results dropdown UI/UX, just with a fixed filter instead of a text query. */
function renderMultiList() {
  const resultsEl = $('searchResults');
  const matches = [];
  questions.forEach((q, qi) => { if (isMulti(q)) matches.push(qi); });

  resultsEl.hidden = false;
  if (!matches.length) {
    resultsEl.innerHTML = `<div class="search-empty">Không có câu multi choice nào</div>`;
    return;
  }

  resultsEl.innerHTML = `<div class="search-count">${matches.length} câu multi choice</div>` + matches.map(qi => {
    const q = questions[qi];
    const plain = toPlainText(q.question_text);
    const snippet = escapeHtml(plain.slice(0, 140)) + (plain.length > 140 ? '…' : '');
    return `<button type="button" class="search-result" data-qi="${qi}">
      <span class="sr-top">
        <span class="sr-meta">${ico('i-layers')}Topic ${q.topic_number} · Câu ${q.question_number} · Chọn ${correctSet(q).size} đáp án</span>
        ${answerStatusBadge(qi)}
      </span>
      <span class="sr-snippet">${snippet}</span>
    </button>`;
  }).join('');

  resultsEl.querySelectorAll('.search-result').forEach(btn => {
    btn.addEventListener('click', () => {
      idx = parseInt(btn.dataset.qi, 10);
      saveProgress();
      render();
      updateProgress();
      closeMultiList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function closeMultiList() {
  $('searchResults').hidden = true;
  $('searchResults').innerHTML = '';
  $('multiListBtn').classList.remove('active');
  listMode = null;
}

function toggleMultiList() {
  if (listMode === 'multi') { closeMultiList(); return; }
  closeSearch();
  listMode = 'multi';
  $('multiListBtn').classList.add('active');
  renderMultiList();
}

function answerStatusBadge(qi) {
  const a = answered[qi];
  if (!a) return `<span class="sr-status">Chưa làm</span>`;
  return a.correct
    ? `<span class="sr-status ok">${ico('i-check')}Đúng</span>`
    : `<span class="sr-status err">${ico('i-x')}Sai</span>`;
}

function isMulti(q) { return (q.answer || '').replace(/[^A-Z]/gi, '').length > 1; }
function correctSet(q) { return new Set((q.answer || '').toUpperCase().replace(/[^A-Z]/g, '').split('')); }

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Order in which answers are displayed/copied for question qi.
   Correctness checking always keys off the original letter (data-key), never this order,
   so shuffling never affects grading — only visual/copy order. */
function getDisplayKeys(qi, q) {
  const sortedKeys = Object.keys(q.answers).sort();
  if (!shuffleAnswers) return sortedKeys;
  if (!shuffleOrder[qi]) shuffleOrder[qi] = shuffleArray(sortedKeys);
  return shuffleOrder[qi];
}

function loadShufflePref() {
  try { shuffleAnswers = localStorage.getItem(SHUFFLE_KEY) === '1'; } catch (e) {}
}
function saveShufflePref() {
  try { localStorage.setItem(SHUFFLE_KEY, shuffleAnswers ? '1' : '0'); } catch (e) {}
}

function loadProgress() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    answered = s.answered || {};
    idx = typeof s.idx === 'number' ? s.idx : 0;
  } catch (e) {}
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ answered, idx })); } catch (e) {}
}

function stats() {
  const vals = Object.values(answered);
  return { ok: vals.filter(a => a.correct).length, err: vals.filter(a => !a.correct).length, done: vals.length };
}

function updateProgress() {
  const { ok, err, done } = stats();
  $('progressWrap').hidden = false;
  $('progressFill').style.width = (done / questions.length * 100) + '%';
  $('progressLabel').textContent = `Câu ${idx + 1} / ${questions.length}`;
  $('okCount').textContent = ok;
  $('errCount').textContent = err;
  $('navMeta').innerHTML = `<b>${done}</b>/${questions.length} đã làm · <b>${ok}</b> đúng`;
}

function render() {
  const q = questions[idx];
  if (!q) return;
  const multi = isMulti(q);
  const cset = correctSet(q);
  const prev = answered[idx];
  const keys = getDisplayKeys(idx, q);

  const answersHTML = keys.map(k => {
    let cls = 'answer ' + (multi ? 'multi' : 'single');
    let mark = '';
    if (prev) {
      cls += ' locked';
      if (cset.has(k)) { cls += ' correct'; mark = `<span class="mark">${ico('i-check')}</span>`; }
      else if (prev.picked.includes(k)) { cls += ' wrong'; mark = `<span class="mark">${ico('i-x')}</span>`; }
    }
    return `<button type="button" class="${cls}" data-key="${k}">
      <span class="key">${shuffleAnswers ? '' : k}</span>
      <span class="atext">${renderHTML(q.answers[k])}</span>
      ${mark}
    </button>`;
  }).join('');

  const typeBadge = multi
    ? `<span class="badge multi">${ico('i-list')}Chọn ${cset.size} đáp án</span>`
    : `<span class="badge">${ico('i-check-circle')}Một đáp án</span>`;

  app.innerHTML = `
    <div class="qcard">
      <div class="qmeta">
        <span class="topic">${ico('i-layers')}Topic ${q.topic_number} · Câu ${q.question_number}</span>
        ${typeBadge}
        <button type="button" class="copybtn" id="copyBtn">${ico('i-copy')}Copy cho AI</button>
        <button type="button" class="copybtn" id="clearHlBtn" title="Xóa các đoạn đã highlight trong câu này">${ico('i-eraser')}Xóa highlight</button>
        <a class="reflink" href="${q.link}" target="_blank" rel="noopener">examtopics ${ico('i-external')}</a>
      </div>
      <div class="qtext">${renderHTML(q.question_text)}</div>
      <div class="answers" id="answers">${answersHTML}</div>
      <div class="qactions" id="qactions"></div>
      <div class="qnav">
        <button class="btn btn-ghost" id="prevBtn" ${idx === 0 ? 'disabled' : ''}>${ico('i-prev')}Trước</button>
        <div class="qjump">
          <input type="number" id="jumpInput" min="1" max="${questions.length}" value="${idx + 1}"> / ${questions.length}
        </div>
        <button class="btn btn-ghost" id="nextBtn" ${idx === questions.length - 1 ? 'disabled' : ''}>Sau${ico('i-next')}</button>
      </div>
      <div class="kbd-hint">Mẹo: dùng <kbd>←</kbd> <kbd>→</kbd> để chuyển câu</div>
    </div>
  `;

  const answersEl = $('answers');
  if (!prev) {
    let selected = new Set();
    answersEl.querySelectorAll('.answer').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.key;
        if (multi) {
          if (selected.has(k)) { selected.delete(k); btn.classList.remove('selected'); }
          else { selected.add(k); btn.classList.add('selected'); }
        } else {
          selected = new Set([k]);
          answersEl.querySelectorAll('.answer').forEach(b => b.classList.toggle('selected', b === btn));
        }
        renderActions(false, selected, multi, cset, q);
      });
    });
    renderActions(false, selected, multi, cset, q);
  } else {
    renderActions(true, new Set(prev.picked), multi, cset, q);
  }

  $('copyBtn').addEventListener('click', () => copyQuestion(q, idx, $('copyBtn')));
  $('clearHlBtn').addEventListener('click', clearHighlights);
  $('prevBtn').addEventListener('click', () => go(-1));
  $('nextBtn').addEventListener('click', () => goNext());
  $('jumpInput').addEventListener('change', e => {
    const n = parseInt(e.target.value, 10);
    if (!isNaN(n) && n >= 1 && n <= questions.length) { idx = n - 1; saveProgress(); render(); updateProgress(); }
  });

  updateProgress();
}

function renderActions(isAnswered, selected, multi, cset, q) {
  const el = $('qactions');
  if (!isAnswered) {
    el.innerHTML = `
      <button class="btn btn-primary" id="checkBtn" ${selected.size === 0 ? 'disabled' : ''}>${ico('i-check')}Kiểm tra</button>
      <span class="hint">${multi ? `Chọn <b>${cset.size}</b> đáp án rồi kiểm tra` : 'Chọn một đáp án'}</span>
    `;
    $('checkBtn').addEventListener('click', () => check(selected, cset, q));
  } else {
    const correct = answered[idx].correct;
    const hintText = shuffleAnswers
      ? 'Đáp án đúng đã được đánh dấu trực tiếp ở trên'
      : `Đáp án đúng: <b>${[...cset].sort().join(', ')}</b>`;
    el.innerHTML = `
      <span class="verdict ${correct ? 'ok' : 'err'}">${ico(correct ? 'i-check' : 'i-x')}${correct ? 'Chính xác' : 'Chưa đúng'}</span>
      <span class="hint">${hintText}</span>
      <button class="btn ${correct ? 'btn-good' : 'btn-primary'}" id="contBtn" style="margin-left:auto">
        ${idx === questions.length - 1 ? `${ico('i-award')}Xem kết quả` : `Câu tiếp${ico('i-next')}`}
      </button>
    `;
    $('contBtn').addEventListener('click', () => goNext());
  }
}

function copyQuestion(q, qi, btn) {
  const text = questionToText(q, qi);
  const ok = () => {
    const orig = btn.innerHTML;
    btn.classList.add('done');
    btn.innerHTML = `${ico('i-check')}Đã copy`;
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = orig; }, 1800);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(ok).catch(() => fallbackCopy(text, ok));
  } else {
    fallbackCopy(text, ok);
  }
}
function fallbackCopy(text, ok) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); ok(); } catch (e) { alert('Không copy được. Hãy copy thủ công.'); }
  document.body.removeChild(ta);
}

/* ── TEXT HIGHLIGHT ──
   Highlights are DOM-only (never saved to storage/state), so they vanish
   automatically whenever render() rebuilds the card (next/prev question). */
function getTextNodesInRange(range) {
  const root = range.commonAncestorContainer;
  const container = root.nodeType === 3 ? root.parentNode : root;
  const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let node;
  while ((node = walker.nextNode())) {
    if (range.intersectsNode(node)) nodes.push(node);
  }
  return nodes;
}

function highlightSelection() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  if (range.toString().trim() === '') { sel.removeAllRanges(); return; }

  const qcard = $('app').querySelector('.qcard');
  if (!qcard || !qcard.contains(range.commonAncestorContainer)) return;

  getTextNodesInRange(range).forEach(node => {
    if (node.parentNode && node.parentNode.classList && node.parentNode.classList.contains('hl')) return;
    const start = node === range.startContainer ? range.startOffset : 0;
    const end = node === range.endContainer ? range.endOffset : node.length;
    if (start >= end) return;
    const middle = node.splitText(start);
    middle.splitText(end - start);
    const mark = document.createElement('mark');
    mark.className = 'hl';
    middle.parentNode.insertBefore(mark, middle);
    mark.appendChild(middle);
  });

  sel.removeAllRanges();
}

function clearHighlights() {
  const qcard = $('app').querySelector('.qcard');
  if (!qcard) return;
  qcard.querySelectorAll('mark.hl').forEach(mark => {
    const parent = mark.parentNode;
    while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  });
}

app.addEventListener('mouseup', () => setTimeout(highlightSelection, 0));
app.addEventListener('touchend', () => setTimeout(highlightSelection, 0));

function check(selected, cset, q) {
  const picked = [...selected];
  const correct = picked.length === cset.size && picked.every(k => cset.has(k));
  answered[idx] = { picked, correct };
  saveProgress();
  render();
}

function go(delta) {
  const n = idx + delta;
  if (n >= 0 && n < questions.length) { idx = n; saveProgress(); render(); updateProgress(); }
}
function goNext() {
  if (idx < questions.length - 1) go(1);
  else showSummary();
}

function showSummary() {
  const { ok, err, done } = stats();
  const pct = done ? Math.round(ok / done * 100) : 0;
  const r = 70, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  const ringColor = pct >= 70 ? 'var(--good)' : pct >= 50 ? 'var(--warn)' : 'var(--bad)';
  app.innerHTML = `
    <div class="summary">
      <h2>${ico('i-award')} Kết quả luyện tập</h2>
      <div class="donut">
        <svg width="168" height="168">
          <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="14"/>
          <circle cx="84" cy="84" r="${r}" fill="none" stroke="${ringColor}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"
            style="transition:stroke-dashoffset 1s var(--ease)" id="ring"/>
        </svg>
        <div class="donut-center"><b>${pct}<span style="font-size:1.2rem">%</span></b><span>chính xác</span></div>
      </div>
      <div class="summary-stats">
        <div class="sstat ok"><b>${ok}</b><span>đúng</span></div>
        <div class="sstat err"><b>${err}</b><span>sai</span></div>
        <div class="sstat"><b>${questions.length - done}</b><span>chưa làm</span></div>
      </div>
      <div class="summary-actions">
        <button class="btn btn-primary" id="reviewBtn">${ico('i-prev')}Xem lại từ đầu</button>
        <button class="btn btn-ghost" id="restartBtn">${ico('i-refresh')}Làm lại từ đầu</button>
      </div>
    </div>
  `;
  $('progressFill').style.width = '100%';
  requestAnimationFrame(() => { const ring = $('ring'); if (ring) ring.style.strokeDashoffset = off; });
  $('reviewBtn').addEventListener('click', () => { idx = 0; saveProgress(); render(); });
  $('restartBtn').addEventListener('click', resetAll);
}

function resetAll() {
  if (!confirm('Xóa toàn bộ tiến trình và làm lại từ đầu?')) return;
  answered = {}; idx = 0; shuffleOrder = {};
  localStorage.removeItem(STORAGE_KEY);
  render(); updateProgress();
}

$('resetBtn').addEventListener('click', resetAll);

loadShufflePref();
$('shuffleToggle').checked = shuffleAnswers;
$('shuffleToggle').addEventListener('change', e => {
  shuffleAnswers = e.target.checked;
  shuffleOrder = {};
  saveShufflePref();
  if (questions.length) render();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { const b = $('nextBtn'); if (b && !b.disabled) b.click(); }
  if (e.key === 'ArrowLeft') { const b = $('prevBtn'); if (b && !b.disabled) b.click(); }
});

$('searchInput').addEventListener('input', e => performSearch(e.target.value));
$('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === 'Enter') {
    const v = e.target.value.trim();
    if (v) { addToSearchHistory(v); performSearch(v); }
  }
});
$('searchClearBtn').addEventListener('click', () => { closeSearch(); $('searchInput').focus(); });
$('multiListBtn').addEventListener('click', toggleMultiList);
document.addEventListener('click', e => {
  if (!$('searchWrap').contains(e.target)) {
    $('searchResults').hidden = true;
    $('multiListBtn').classList.remove('active');
    listMode = null;
  }
});
$('searchInput').addEventListener('focus', () => {
  const v = $('searchInput').value.trim();
  if (v) { $('searchResults').hidden = false; } else { renderSearchHistory(); }
});

loadSearchScope();
initSearchScopeFilters();
loadSearchHistory();

const scrollTopBtn = $('scrollTopBtn');
window.addEventListener('scroll', () => {
  scrollTopBtn.classList.toggle('visible', window.scrollY > 400);
});
scrollTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    questions = data.filter(q => q && q.answers && q.question_text);
    if (!questions.length) throw new Error('Không có câu hỏi nào');
    buildSearchIndex();
    $('multiListCount').textContent = questions.filter(isMulti).length;
    $('searchWrap').hidden = false;
    loadProgress();
    if (idx >= questions.length) idx = 0;
    const jumpTo = new URLSearchParams(location.search).get('q');
    if (jumpTo) {
      const target = questions.findIndex(q => String(q.question_number) === String(jumpTo));
      if (target !== -1) idx = target;
    }
    render();
    updateProgress();
  })
  .catch(err => {
    app.innerHTML = `<div class="state err">${ico('i-alert')}<br>Không tải được dữ liệu câu hỏi.<br>${err.message}<br><br>
      Hãy mở trang qua một web server (vd: <kbd>npx serve</kbd>) thay vì mở file trực tiếp.</div>`;
    $('navMeta').textContent = 'Lỗi tải dữ liệu';
  });
</script>

</body>
</html>
