<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thư viện ảnh — AIP-C01</title>
<link rel="icon" type="image/png" href="v-icon.png">
<meta name="description" content="Thư viện ảnh — xem toàn màn hình, phóng to/thu nhỏ và di chuyển ảnh.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0B0D13;
    --bg-2:      #0F1117;
    --surface:   #161925;
    --surface-2: #1C2030;
    --surface-3: #232838;
    --border:    #272C3E;
    --border-2:  #333A52;
    --text:      #F2F4FA;
    --muted:     #9AA3B7;
    --muted-2:   #6B7488;

    --accent:    #6366F1;
    --accent-2:  #818CF8;
    --accent-dim: rgba(99, 102, 241, 0.14);
    --good:      #34D399;
    --good-dim:  rgba(52, 211, 153, 0.14);

    --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    --font-body: 'IBM Plex Sans', -apple-system, 'Segoe UI', system-ui, sans-serif;

    --space-xs: 0.375rem;
    --space-s:  0.75rem;
    --space-m:  1.25rem;
    --space-l:  2rem;
    --space-xl: 3rem;

    --radius:    10px;
    --radius-lg: 16px;
    --radius-xl: 22px;

    --shadow:    0 8px 24px rgba(0,0,0,0.35);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  html { font-size: 16px; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  body {
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(52,211,153,0.06), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.65;
    min-height: 100vh;
  }

  ::selection { background: var(--accent-dim); color: var(--text); }
  *:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 4px; }

  .icon { width: 1.15em; height: 1.15em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

  main { max-width: 1100px; margin: 0 auto; padding: var(--space-l) var(--space-l) var(--space-xl); }

  .hero { margin-bottom: var(--space-l); }
  .hero .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.04em;
    color: var(--good); background: var(--good-dim); border: 1px solid rgba(52,211,153,0.3);
    padding: 3px 11px; border-radius: 999px; margin-bottom: var(--space-m);
  }
  .hero h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: var(--space-s); }
  .hero p { color: var(--muted); font-size: 1rem; max-width: 68ch; }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--space-m);
  }
  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    cursor: zoom-in;
    aspect-ratio: 1 / 1;
    transition: border-color .2s var(--ease), transform .2s var(--ease);
  }
  .card:hover { border-color: var(--border-2); transform: translateY(-2px); }
  .card img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .35s var(--ease);
  }
  .card:hover img { transform: scale(1.04); }
  .card .cap {
    position: absolute; inset: auto 0 0 0;
    padding: 8px 10px;
    font-size: 0.72rem; color: var(--muted);
    background: linear-gradient(0deg, rgba(11,13,19,0.9), transparent);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .expand {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center;
    background: rgba(11,13,19,0.55);
    backdrop-filter: blur(6px);
    color: var(--text);
    opacity: 0; transition: opacity .2s var(--ease);
  }
  .card:hover .expand { opacity: 1; }
  .card .expand .icon { width: 16px; height: 16px; }

  .empty {
    color: var(--muted); text-align: center; padding: var(--space-xl) 0;
    border: 1px dashed var(--border-2); border-radius: var(--radius-lg);
  }

  /* ── VIEWER ── */
  .viewer {
    position: fixed; inset: 0;
    background: rgba(6, 7, 11, 0.97);
    display: none;
    flex-direction: column;
    z-index: 1000;
  }
  .viewer.open { display: flex; }

  .viewer-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-m);
    padding: var(--space-s) var(--space-m);
    color: var(--muted);
    font-family: var(--font-mono); font-size: 0.78rem;
    flex: 0 0 auto;
    z-index: 2;
  }
  .viewer-bar .name { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50vw; }
  .viewer-tools { display: flex; align-items: center; gap: 6px; }
  .vbtn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 9px;
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); cursor: pointer;
    transition: background .2s var(--ease), border-color .2s var(--ease);
  }
  .vbtn:hover { background: var(--surface-3); border-color: var(--border-2); }
  .vbtn:active { transform: scale(0.94); }
  .vbtn .icon { width: 17px; height: 17px; }
  .zoom-pct { min-width: 46px; text-align: center; color: var(--muted-2); }

  .viewer-stage {
    position: relative;
    flex: 1 1 auto;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  .viewer-stage img {
    max-width: 90vw; max-height: 80vh;
    user-select: none; -webkit-user-drag: none;
    will-change: transform;
    transform-origin: 0 0;
    cursor: grab;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border-radius: 4px;
  }
  .viewer-stage.grabbing img { cursor: grabbing; }
  .viewer-stage img.no-transition { transition: none; }
  .viewer-stage img.animated { transition: transform .25s var(--ease); }

  .nav-arrow {
    position: absolute; top: 50%; translate: 0 -50%;
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(22,25,37,0.7); border: 1px solid var(--border);
    color: var(--text); display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(6px);
    transition: background .2s var(--ease);
    z-index: 2;
  }
  .nav-arrow:hover { background: var(--surface-3); }
  .nav-arrow.prev { left: 16px; }
  .nav-arrow.next { right: 16px; }
  .nav-arrow .icon { width: 22px; height: 22px; }

  .viewer-hint {
    text-align: center; padding: 6px 0 var(--space-s);
    color: var(--muted-2); font-size: 0.72rem;
    flex: 0 0 auto;
  }

  @media (max-width: 640px) {
    .viewer-bar .name { max-width: 40vw; }
    .nav-arrow { width: 38px; height: 38px; }
    .viewer-hint { display: none; }
  }
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/><path d="M10 6h10M10 12h10M10 18h10"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
  <symbol id="i-clipboard" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="2"/><path d="M9 2h6v4H9z"/><path d="M9 11h6M9 15h6"/></symbol>
  <symbol id="i-gap" viewBox="0 0 24 24"><path d="M9 3v18M15 3v18"/><path d="M3 9h4M17 9h4M3 15h4M17 15h4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 19h16"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
</svg>

<nav data-nav></nav>
<script src="nav.js"></script>

<main>
  <div class="hero">
    <span class="eyebrow"><svg class="icon"><use href="#i-image"/></svg> Gallery</span>
    <h1>Thư viện ảnh</h1>
    <p>Bấm vào ảnh để xem toàn màn hình — có thể phóng to/thu nhỏ (lăn chuột, pinch) và kéo để di chuyển.</p>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Không tìm thấy ảnh nào trong thư mục <code>image/</code>.</div>
</main>

<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <div class="name" id="viewerName">—</div>
    <div class="viewer-tools">
      <button class="vbtn" id="btnZoomOut" title="Thu nhỏ (-)"><svg class="icon"><use href="#i-minus"/></svg></button>
      <span class="zoom-pct" id="zoomPct">100%</span>
      <button class="vbtn" id="btnZoomIn" title="Phóng to (+)"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button class="vbtn" id="btnReset" title="Đặt lại (0)"><svg class="icon"><use href="#i-reset"/></svg></button>
      <button class="vbtn" id="btnDownload" title="Tải ảnh"><svg class="icon"><use href="#i-download"/></svg></button>
      <button class="vbtn" id="btnClose" title="Đóng (Esc)"><svg class="icon"><use href="#i-x"/></svg></button>
    </div>
  </div>

  <div class="viewer-stage" id="stage">
    <button class="nav-arrow prev" id="btnPrev" title="Ảnh trước (←)"><svg class="icon"><use href="#i-chevron-left"/></svg></button>
    <img id="viewerImg" src="" alt="">
    <button class="nav-arrow next" id="btnNext" title="Ảnh sau (→)"><svg class="icon"><use href="#i-chevron-right"/></svg></button>
  </div>

  <div class="viewer-hint">Lăn chuột để zoom · Kéo để di chuyển · Double-click để reset · ← → chuyển ảnh · Esc để đóng</div>
</div>

<script>
(() => {
  const IMAGES = [
    'ChatGPT Image Jul 19, 2026, 08_57_43 PM.png',
    'ChatGPT Image Jul 19, 2026, 08_58_15 PM.png',
    'ChatGPT Image Jul 19, 2026, 09_14_50 PM.png',
    'ChatGPT Image Jul 26, 2026, 10_33_55 PM.png',
    'ChatGPT Image Jul 26, 2026, 10_44_22 PM.png',
  ].map(name => ({ name, url: 'image/' + encodeURIComponent(name) }));

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');

  if (!IMAGES.length) {
    empty.hidden = false;
  } else {
    grid.innerHTML = IMAGES.map((img, i) => `
      <div class="card" data-index="${i}">
        <img src="${img.url}" alt="${img.name}" loading="lazy">
        <div class="expand"><svg class="icon"><use href="#i-expand"/></svg></div>
        <div class="cap">${img.name}</div>
      </div>
    `).join('');
  }

  // ── Viewer state ──
  const viewer = document.getElementById('viewer');
  const stage = document.getElementById('stage');
  const viewerImg = document.getElementById('viewerImg');
  const viewerName = document.getElementById('viewerName');
  const zoomPct = document.getElementById('zoomPct');

  let index = 0;
  let scale = 1, tx = 0, ty = 0;
  const MIN_SCALE = 0.5, MAX_SCALE = 8;

  function clampScale(s) { return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s)); }

  function apply(animated) {
    viewerImg.classList.toggle('animated', !!animated);
    viewerImg.classList.toggle('no-transition', !animated);
    viewerImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    zoomPct.textContent = Math.round(scale * 100) + '%';
  }

  function resetView(animated) {
    scale = 1; tx = 0; ty = 0;
    apply(animated);
  }

  function centerImage() {
    // Center the (unscaled, transform-origin 0 0) image within the stage.
    const rect = stage.getBoundingClientRect();
    const iw = viewerImg.naturalWidth, ih = viewerImg.naturalHeight;
    if (!iw || !ih) return;
    const displayed = Math.min(rect.width * 0.9 / iw, rect.height * 0.8 / ih, 1) * iw;
    // Let CSS max-width/max-height determine base size; just center via flex, offsets stay 0.
  }

  function open(i) {
    index = (i + IMAGES.length) % IMAGES.length;
    const img = IMAGES[index];
    viewerImg.src = img.url;
    viewerImg.alt = img.name;
    viewerName.textContent = img.name;
    resetView(false);
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function close() {
    viewer.classList.remove('open');
    document.body.style.overflow = '';
  }

  function step(delta) {
    open(index + delta);
  }

  grid.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    open(Number(card.dataset.index));
  });

  document.getElementById('btnClose').addEventListener('click', close);
  document.getElementById('btnPrev').addEventListener('click', () => step(-1));
  document.getElementById('btnNext').addEventListener('click', () => step(1));
  document.getElementById('btnReset').addEventListener('click', () => resetView(true));
  document.getElementById('btnZoomIn').addEventListener('click', () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.4));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.4));
  document.getElementById('btnDownload').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = IMAGES[index].url;
    a.download = IMAGES[index].name;
    a.click();
  });

  viewer.addEventListener('click', e => {
    if (e.target === viewer) close();
  });

  function zoomAt(cx, cy, factor) {
    const newScale = clampScale(scale * factor);
    if (newScale === scale) return;
    const ratio = newScale / scale;
    // Keep the point under the cursor stationary.
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = newScale;
    apply(true);
  }

  stage.addEventListener('wheel', e => {
    if (!viewer.classList.contains('open')) return;
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const cx = e.clientX - rect.left;
    const cy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(cx, cy, factor);
  }, { passive: false });

  viewerImg.addEventListener('dblclick', e => {
    if (scale > 1) {
      resetView(true);
    } else {
      const rect = stage.getBoundingClientRect();
      zoomAt(e.clientX - rect.left, e.clientY - rect.top, 2.5);
    }
  });

  // ── Drag to pan (mouse) ──
  let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;

  viewerImg.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startTx = tx; startTy = ty;
    stage.classList.add('grabbing');
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    tx = startTx + (e.clientX - startX);
    ty = startTy + (e.clientY - startY);
    apply(false);
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    stage.classList.remove('grabbing');
  });

  // ── Touch: drag + pinch zoom ──
  let touchMode = null; // 'pan' | 'pinch'
  let pinchStartDist = 0, pinchStartScale = 1;
  let pinchMidX = 0, pinchMidY = 0;

  function dist(t0, t1) {
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }

  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
      touchMode = 'pan';
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = tx; startTy = ty;
    } else if (e.touches.length === 2) {
      touchMode = 'pinch';
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      const rect = stage.getBoundingClientRect();
      pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
    }
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    if (touchMode === 'pan' && e.touches.length === 1) {
      tx = startTx + (e.touches[0].clientX - startX);
      ty = startTy + (e.touches[0].clientY - startY);
      apply(false);
    } else if (touchMode === 'pinch' && e.touches.length === 2) {
      const d = dist(e.touches[0], e.touches[1]);
      const factor = d / pinchStartDist;
      const newScale = clampScale(pinchStartScale * factor);
      const ratio = newScale / scale;
      tx = pinchMidX - (pinchMidX - tx) * ratio;
      ty = pinchMidY - (pinchMidY - ty) * ratio;
      scale = newScale;
      apply(false);
    }
    e.preventDefault();
  }, { passive: false });

  stage.addEventListener('touchend', () => { touchMode = null; });

  // ── Keyboard ──
  window.addEventListener('keydown', e => {
    if (!viewer.classList.contains('open')) return;
    switch (e.key) {
      case 'Escape': close(); break;
      case 'ArrowLeft': step(-1); break;
      case 'ArrowRight': step(1); break;
      case '+': case '=': zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.3); break;
      case '-': zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.3); break;
      case '0': resetView(true); break;
    }
  });
})();
</script>

</body>
</html>
